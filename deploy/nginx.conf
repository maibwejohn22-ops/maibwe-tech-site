# nginx — johnmaibwe.com (Applications John Maibwe)
# TLS est terminé par le proxy Traefik de Coolify ; ce conteneur ne voit que du HTTP interne.

# www.johnmaibwe.com → johnmaibwe.com, en 301 (permanent) et en gardant le chemin.
# (La redirection www de Coolify est en 302 : elle est désactivée dans Coolify, réglage « both ».)
server {
    listen 8080;
    server_name www.johnmaibwe.com;
    server_tokens off;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://johnmaibwe.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Pas de journal des visites (Loi 25 : minimisation) ; les erreurs restent journalisées.
    access_log off;
    charset utf-8;
    # Redirections relatives : pas de « http://hôte:8080/… » derrière le proxy.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml application/manifest+json text/plain;

    # En-têtes de sécurité (hérités par tous les « location » : n'y mettre aucun add_header).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com https://web3forms.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /.well-known/ (security.txt) : seul dossier « caché » servi, et seulement ses fichiers.
    location ^~ /.well-known/ {
        try_files $uri =404;
        default_type text/plain;
    }

    # Jamais de fichiers cachés (.git, .env, .DS_Store…) — évalué avant les autres regex.
    location ~ /\. { return 404; }

    # Pages : URL avec ou sans « .html » (/confidentialite ≡ /confidentialite.html).
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    # CSS/JS non versionnés : le navigateur revalide à chaque visite (ETag → 304 si inchangé),
    # pour qu'une mise à jour du site ne mélange jamais nouveau HTML et ancien CSS.
    # Les images changent de nom quand elles changent : cache long.
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires -1;
    }
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    # Dossier sans index (/adprotectx/, /promptcam/) : page 404 plutôt qu'un 403 nginx.
    error_page 403 404 =404 /404.html;
    location = /404.html { internal; expires -1; }
    location = /50x.html { internal; }
}

<!doctype html>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
      font-family: "Montserrat", "Segoe UI", "Helvetica Neue", sans-serif; color: #F5F0E6;

    main { max-width: 560px; text-align: center; display: grid; gap: 18px; justify-items: center; }

    .code { font-size: 64px; font-weight: 800; line-height: 1; background: linear-gradient(71deg, #B79CFF, #D29B38); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 22px; margin: 0; }
    p { margin: 0; color: #B9C6D8; line-height: 1.6; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
    a.btn { display: inline-block; padding: 13px 26px; border-radius: 999px; font-weight: 700; text-decoration: none; color: #FFFFFF; background: linear-gradient(71deg, #A049F7 0%, #806BFF 73%); }
    a.btn.alt { background: transparent; border: 2px solid rgba(255,255,255,.3); }
    hr { width: 60px; border: 0; border-top: 1px solid rgba(255,255,255,.2); margin: 8px 0; }
  </style>
</head>

    <div class="links">
      <a class="btn" href="/">Retour à l’accueil</a>

    </div>
  </main>
